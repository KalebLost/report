<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADHD Symptom Report</title>
<meta name="description" content="Interactive visualization of an ADxS.org Symptomtest V5 result.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f1;
  --surface: #fcfcfb;
  --surface-2: #efeeea;
  --border: #e2e1dc;
  --text: #0b0b0b;
  --text-2: #52514e;
  --muted: #8a8984;
  --found: #2a78d6;
  --found-soft: #cde2fb;
  --notfound: #c9c8c2;
  --ref: #a3a29c;
  --accent: #eb6834;
  --warn: #c98500;
  --warn-soft: #fbefd2;
  --grid: #e8e7e2;
  --band-1: #cde2fb; --band-2: #9ec5f4; --band-3: #5598e7; --band-4: #1c5cab;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111110; --surface: #1a1a19; --surface-2: #232321; --border: #2e2e2b;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #8d8c85;
    --found: #3987e5; --found-soft: #184f95; --notfound: #45453f; --ref: #6f6e68;
    --accent: #d95926; --warn: #eda100; --warn-soft: #3a2f12; --grid: #2a2a27;
    --band-1: #104281; --band-2: #1c5cab; --band-3: #3987e5; --band-4: #86b6ef;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --surface: #1a1a19; --surface-2: #232321; --border: #2e2e2b;
  --text: #f0efec; --text-2: #c3c2b7; --muted: #8d8c85;
  --found: #3987e5; --found-soft: #184f95; --notfound: #45453f; --ref: #6f6e68;
  --accent: #d95926; --warn: #eda100; --warn-soft: #3a2f12; --grid: #2a2a27;
  --band-1: #104281; --band-2: #1c5cab; --band-3: #3987e5; --band-4: #86b6ef;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.55 Inter, system-ui, -apple-system, Segoe UI, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 32px 16px 64px; }
header.hero { display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; align-items: center; margin-bottom: 28px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); }
h1 { font-size: clamp(30px, 5vw, 46px); line-height: 1.08; margin: 8px 0 12px; font-weight: 800; letter-spacing: -.02em; }
h1 span { color: var(--found); }
.lede { color: var(--text-2); max-width: 52ch; margin: 0; }
.theme-toggle { margin-top: 16px; background: var(--surface); color: var(--text-2); border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; }
.card h2 { font-size: 17px; margin: 0 0 4px; font-weight: 700; }
.card .sub { color: var(--text-2); font-size: 13px; margin: 0 0 16px; }
.grid { display: grid; gap: 16px; }
.g-4 { grid-template-columns: repeat(4, 1fr); }
.g-2 { grid-template-columns: repeat(2, 1fr); }
.section { margin-top: 16px; }
.stat .label { font-size: 13px; color: var(--text-2); }
.stat .value { font-size: 34px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; margin-top: 6px; font-variant-numeric: tabular-nums; }
.stat .value small { font-size: 16px; font-weight: 600; color: var(--muted); }
.stat .note { font-size: 12px; color: var(--muted); margin-top: 4px; }
/* ring */
.ring-card { display: flex; align-items: center; gap: 22px; }
.ring { position: relative; width: 190px; height: 190px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .big { font-size: 44px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.ring .of { color: var(--text-2); font-size: 13px; margin-top: 4px; }
.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--found-soft); color: var(--text); }
/* severity band */
.band { position: relative; margin: 34px 0 8px; }
.band-track { display: flex; height: 14px; border-radius: 7px; overflow: hidden; gap: 2px; }
.band-track div { height: 100%; }
.band-labels { display: flex; gap: 2px; margin-top: 8px; font-size: 12px; color: var(--text-2); }
.band-labels div { text-align: center; }
.band-labels b { display: block; color: var(--text); font-weight: 600; }
.marker { position: absolute; top: -30px; transform: translateX(-50%); text-align: center; font-size: 12px; font-weight: 700; white-space: nowrap; }
.marker::after { content: ""; display: block; width: 2px; height: 24px; background: var(--text); margin: 2px auto 0; }
.ref-mark { position: absolute; top: 18px; transform: translateX(-50%); font-size: 11px; color: var(--muted); white-space: nowrap; }
/* criteria bars */
.crit { display: grid; gap: 18px; }
.crit-row .top { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; gap: 8px; }
.crit-row .top b { font-variant-numeric: tabular-nums; }
.crit-track { position: relative; height: 12px; background: var(--surface-2); border-radius: 6px; }
.crit-fill { position: absolute; inset: 0 auto 0 0; background: var(--found); border-radius: 6px; width: 0; transition: width 1.1s cubic-bezier(.2,.8,.2,1); }
.crit-thr { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--text); }
.crit-thr span { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--text-2); white-space: nowrap; }
.crit-row .meta { font-size: 12px; color: var(--muted); margin-top: 20px; }
.ok { color: var(--found); font-weight: 600; }
/* tiles */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.filters button { font: inherit; font-size: 13px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.filters button.active { background: var(--text); color: var(--surface); border-color: var(--text); }
.cats { display: grid; gap: 14px; }
.cat-row { display: grid; grid-template-columns: 170px 1fr; gap: 12px; align-items: start; }
.cat-name { font-size: 13px; font-weight: 600; padding-top: 7px; }
.cat-name small { display: block; font-weight: 400; color: var(--muted); }
.tiles { display: flex; flex-wrap: wrap; gap: 6px; }
.tile { font-size: 12.5px; padding: 6px 10px; border-radius: 8px; border: 1px solid transparent; transition: opacity .2s, transform .2s; cursor: default; }
.tile.f { background: var(--found); color: #fff; }
.tile.n { background: transparent; color: var(--text-2); border: 1px dashed var(--notfound); }
.tile.dim { opacity: .18; }
.tile:hover { transform: translateY(-1px); }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-2); flex-wrap: wrap; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; }
.chart-box { position: relative; height: 260px; }
.chart-box.tall { height: 360px; }
/* notes */
.notes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.note-card { border-left: 4px solid var(--warn); }
.note-card h3 { margin: 0 0 6px; font-size: 15px; }
.note-card p { margin: 0; color: var(--text-2); font-size: 13.5px; }
.disclaimer { margin-top: 24px; font-size: 13px; color: var(--text-2); background: var(--warn-soft); border-radius: 12px; padding: 14px 16px; }
details { margin-top: 12px; }
summary { cursor: pointer; font-size: 13px; color: var(--text-2); }
table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
th { color: var(--text-2); font-weight: 600; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
footer { margin-top: 32px; color: var(--muted); font-size: 12px; text-align: center; }
@media (max-width: 860px) {
  header.hero, .g-2, .notes { grid-template-columns: 1fr; }
  .g-4 { grid-template-columns: repeat(2, 1fr); }
  .cat-row { grid-template-columns: 1fr; gap: 6px; }
  .cat-name { padding-top: 0; }
}
@media (max-width: 480px) {
  .ring-card { flex-direction: column; align-items: flex-start; }
  .stat .value { font-size: 28px; }
  .band-labels { font-size: 10.5px; }
}
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
.controls .theme-toggle { margin-top: 0; }
.lang-switch { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
.lang-switch button { font: inherit; font-size: 13px; font-weight: 600; border: 0; background: transparent; color: var(--text-2); padding: 4px 12px; border-radius: 999px; cursor: pointer; }
.lang-switch button[aria-pressed="true"] { background: var(--text); color: var(--surface); }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div>
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <h1 data-i18n="h1"></h1>
      <p class="lede" data-i18n="lede"></p>
      <div class="controls">
        <div class="lang-switch" role="group" aria-label="Language / Lingua">
          <button type="button" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="it" aria-pressed="false">IT</button>
        </div>
        <button class="theme-toggle" id="themeBtn" type="button" data-i18n="theme"></button>
      </div>
    </div>
    <div class="card ring-card">
      <div class="ring" role="img" data-i18n-aria="ringAria">
        <svg viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="42" fill="none" stroke="var(--surface-2)" stroke-width="10"/>
          <circle id="ringArc" cx="50" cy="50" r="42" fill="none" stroke="var(--found)" stroke-width="10" stroke-linecap="round" stroke-dasharray="0 264"/>
        </svg>
        <div class="center"><div class="big" id="ringNum">0</div><div class="of" data-i18n="ringOf"></div></div>
      </div>
      <div>
        <span class="pill" data-i18n="pill"></span>
        <p style="margin:10px 0 0;color:var(--text-2);font-size:13.5px" data-i18n="ringText"></p>
      </div>
    </div>
  </header>

  <div class="grid g-4">
    <div class="card stat"><div class="label" data-i18n="s1l"></div><div class="value">92<small> / 169</small></div><div class="note" data-i18n="s1n"></div></div>
    <div class="card stat"><div class="label" data-i18n="s2l"></div><div class="value" data-i18n="s2v"></div><div class="note" data-i18n="s2n"></div></div>
    <div class="card stat"><div class="label" data-i18n="s3l"></div><div class="value">8<small> / 9</small></div><div class="note" data-i18n="s3n"></div></div>
    <div class="card stat"><div class="label" data-i18n="s4l"></div><div class="value">20</div><div class="note" data-i18n="s4n"></div></div>
  </div>

  <section class="card section">
    <h2 data-i18n="bandH"></h2>
    <p class="sub" data-i18n="bandSub"></p>
    <div class="band" id="band">
      <div class="band-track" id="bandTrack"></div>
      <div class="band-labels" id="bandLabels"></div>
    </div>
  </section>

  <div class="grid g-2 section">
    <section class="card">
      <h2 data-i18n="pctH"></h2>
      <p class="sub" data-i18n="pctSub"></p>
      <div class="chart-box"><canvas id="pctChart" data-i18n-aria="pctH"></canvas></div>
    </section>
    <section class="card">
      <h2 data-i18n="scoreH"></h2>
      <p class="sub" data-i18n="scoreSub"></p>
      <div class="chart-box"><canvas id="scoreChart" data-i18n-aria="scoreH"></canvas></div>
    </section>
  </div>

  <section class="card section">
    <h2 data-i18n="critH"></h2>
    <p class="sub" data-i18n="critSub"></p>
    <div class="crit" id="crit"></div>
  </section>

  <section class="card section">
    <h2 data-i18n="catH"></h2>
    <p class="sub" data-i18n="catSub"></p>
    <div class="legend" style="margin-bottom:10px"><span><i style="background:var(--found)"></i><span data-i18n="found"></span></span><span><i style="background:var(--notfound)"></i><span data-i18n="notFound"></span></span></div>
    <div class="chart-box tall"><canvas id="catChart" data-i18n-aria="catH"></canvas></div>
  </section>

  <section class="card section">
    <h2 data-i18n="allH"></h2>
    <p class="sub" data-i18n="allSub"></p>
    <div class="filters" id="filters">
      <button type="button" class="active" data-f="all" data-i18n="fAll"></button>
      <button type="button" data-f="f" data-i18n="fFound"></button>
      <button type="button" data-f="n" data-i18n="fNot"></button>
    </div>
    <div class="cats" id="cats"></div>
  </section>

  <div class="grid g-2 section">
    <section class="card">
      <h2 data-i18n="incH"></h2>
      <p class="sub" data-i18n="incSub"></p>
      <div class="chart-box" style="height:180px"><canvas id="incChart" data-i18n-aria="incH"></canvas></div>
    </section>
    <section class="card">
      <h2 data-i18n="cafH"></h2>
      <p class="sub" data-i18n="cafSub"></p>
      <div class="chart-box" style="height:180px"><canvas id="cafChart" data-i18n-aria="cafH"></canvas></div>
    </section>
  </div>

  <div class="notes section">
    <div class="card note-card"><h3 data-i18n="n1h"></h3><p data-i18n="n1p"></p></div>
    <div class="card note-card"><h3 data-i18n="n2h"></h3><p data-i18n="n2p"></p></div>
    <div class="card note-card"><h3 data-i18n="n3h"></h3><p data-i18n="n3p"></p></div>
  </div>

  <details class="card section">
    <summary data-i18n="tableSum"></summary>
    <table id="dataTable"><thead><tr><th data-i18n="thM"></th><th class="num" data-i18n="thR"></th><th class="num" data-i18n="thRef"></th></tr></thead><tbody></tbody></table>
  </details>

  <div class="disclaimer" data-i18n="disc"></div>

  <footer data-i18n="footer"></footer>
</div>

    allH: "Tutti i 43 sintomi", allSub: "Le caselle piene sono sintomi con segnali nelle risposte; quelle tratteggiate non hanno segnali. Passa sopra una casella per il nome originale tedesco.",
    fAll: "Tutti", fFound: "Rilevati (28)", fNot: "Non rilevati (15)",
    tileFound: "segnali rilevati", tileNot: "nessun segnale",
    incH: "Coerenza delle risposte", incSub: "Alcune risposte si contraddicevano. Più alto è il valore, meno affidabile è il risultato.",
    incAvg: "Media partecipanti", inc: "Incoerenza",
    cafH: "Caffeina giornaliera (stima)", cafSub: "Dalle quantità indicate, con valori tipici di caffeina. 400 mg/giorno è il limite consigliato per gli adulti.",
    caf: ["Caffè / espresso (4 tazze)", "Cola (500 ml)", "Cioccolato (20 g)"], cafTotal: "≈ 380 mg / giorno in totale", cafLabel: "Caffeina",
    n1h: "Forte stress acuto", n1p: "È stato indicato uno stress acuto. Uno stress forte può causare gli stessi sintomi dell'ADHD. Ripetere il test quando lo stress sarà passato aiuterebbe a distinguerli.",
    n2h: "Diagnosi differenziale", n2p: "Sono stati rilevati segnali di <b>anedonia</b>. ADxS.org offre un test separato per questo.",
    n3h: "Incoerenza sopra la media", n3p: "Un valore di incoerenza di 20, rispetto a una media di 8,5, rende questo risultato meno certo.",
    tableSum: "Mostra tutti i numeri in una tabella", thM: "Misura", thR: "Risultato", thRef: "Riferimento",
    rows: {
      sf: ["Sintomi rilevati", "28 / 43 (65,1 %)", "ADHD ≈ 70 % · senza ADHD ≈ 26 %"],
      ta: ["Risposte tipiche dell'ADHD", "92 / 169 (54,4 %)", "—"],
      ws: ["Punteggio ponderato", "8,76", "ADHD 10,18 · senza ADHD 3,66"],
      inc: ["Incoerenza", "20", "media 8,5"],
      area: "Area"
    },
    disc: "<b>Nota bene:</b> i test online di ADxS.org non sono validati dal punto di vista medico. Sono screening che aiutano a capire se una valutazione medica o psicologica potrebbe essere utile. Solo un medico o uno psicologo qualificato può diagnosticare l'ADHD.",
    footer: "Fonte dei dati: report ADxS.org Symptomtest V5. Solo visualizzazione, non una diagnosi."
  }
};

// ---- data (de = original name from the report) ----
const S = (de, en, it) => ({ de, en, it });
const categories = [
  { de: "Exekutivprobleme", en: "Executive function", it: "Funzioni esecutive",
    found: [S("Taskwechselprobleme","Task switching","Cambiare attività"), S("Entscheidungsprobleme","Decision-making","Prendere decisioni"), S("Organisationsprobleme","Organization","Organizzazione"), S("Prokrastination","Procrastination","Procrastinazione"), S("Leistungsprobleme","Performance","Rendimento")],
    not: [S("Lernprobleme","Learning","Apprendimento"), S("Zeitprobleme","Time management","Gestione del tempo"), S("Antriebslosigkeit","Lack of drive","Mancanza di slancio"), S("Denkblockaden","Mental blocks","Blocchi mentali")] },
  { de: "Aufmerksamkeitsprobleme", en: "Attention", it: "Attenzione",
    found: [S("Konzentrationsprobleme","Concentration","Concentrazione"), S("Ablenkbarkeit","Distractibility","Distraibilità"), S("Flüchtigkeitsfehler","Careless mistakes","Errori di distrazione"), S("Vergesslichkeit","Forgetfulness","Smemoratezza"), S("Hyperfokus","Hyperfocus","Iperfocalizzazione")], not: [] },
  { de: "Emotionale Probleme", en: "Emotional", it: "Emotività",
    found: [S("Dysphorie bei Inaktivität","Low mood when inactive","Disforia nell'inattività"), S("Novelty Seeking","Novelty seeking","Ricerca di novità"), S("Frustrationsintoleranz","Low frustration tolerance","Bassa tolleranza alla frustrazione"), S("Selbstwertprobleme","Self-esteem","Autostima"), S("Dysfunktionaler Perfektionismus","Dysfunctional perfectionism","Perfezionismo disfunzionale")],
    not: [S("Aggression","Aggression","Aggressività"), S("Rejection Sensitivity","Rejection sensitivity","Sensibilità al rifiuto"), S("Stimmungsschwankungen","Mood swings","Sbalzi d'umore"), S("Stressempfindlichkeit","Stress sensitivity","Sensibilità allo stress")] },
  { de: "Innere Unruhe", en: "Inner restlessness", it: "Irrequietezza interiore",
    found: [S("Erholungsunfähigkeit","Inability to relax","Incapacità di rilassarsi"), S("Getriebenheit","Feeling driven","Spinta continua"), S("Ungeduld","Impatience","Impazienza")], not: [] },
  { de: "Motorische Probleme", en: "Motor", it: "Motricità",
    found: [S("Hyperaktivität (motorisch)","Motor hyperactivity","Iperattività motoria"), S("Grobmotorikprobleme","Gross motor skills","Motricità grossolana"), S("Feinmotorikprobleme","Fine motor skills","Motricità fine")], not: [] },
  { de: "Impulsivitätsprobleme", en: "Impulsivity", it: "Impulsività",
    found: [S("Handlungsimpulsivität","Impulsive actions","Impulsività nelle azioni"), S("Wahlimpulsivität (Belohnungsaufschub)","Delaying rewards","Rimandare la ricompensa")], not: [] },
  { de: "Suchtprobleme", en: "Addiction", it: "Dipendenze",
    found: [S("Verhaltensgebundene Süchte","Behavioral addictions","Dipendenze comportamentali"), S("Koffeinkonsum","Caffeine use","Consumo di caffeina")],
    not: [S("Alkoholprobleme","Alcohol","Alcol"), S("Nikotin","Nicotine","Nicotina")] },
  { de: "Soziale Probleme", en: "Social", it: "Ambito sociale",
    found: [S("Schulzeitprobleme (Kopfnoten)","School conduct grades","Voti di condotta a scuola")], not: [S("Kommunikationsprobleme","Communication","Comunicazione")] },
  { de: "Körperliche Hinweise", en: "Physical signs", it: "Segnali fisici",
    found: [S("Schmerzempfindlichkeit","Pain sensitivity","Sensibilità al dolore"), S("Tagesrhythmus Eule","Night-owl rhythm","Ritmo nottambulo")],
    not: [S("Schlafprobleme","Sleep","Sonno"), S("Erhöhte Sensibilität","Heightened sensitivity","Sensibilità elevata"), S("Blutdruckprobleme","Blood pressure","Pressione sanguigna")] },
  { de: "Genetik", en: "Genetics", it: "Genetica", found: [], not: [S("Genetik (Familie)","Family history","Familiarità")] }
];
const criteria = [
  { v: 8, max: 9, thr: 5 }, { v: 8, max: 10, thr: 5 }, { v: 7, max: 9, thr: 6 },
  { v: 3, max: 5, thr: 3 }, { v: 5, max: 6, thr: 4 }, { v: 11, max: 12, thr: null }
];

// ---- language state ----
let lang = 'en';
try { const q = new URLSearchParams(location.search).get('lang'); const s = localStorage.getItem('lang'); lang = (q || s || (navigator.language || '').slice(0, 2)) === 'it' ? 'it' : 'en'; } catch (e) {}
const T = () => I18N[lang];
const num = (v, d = 0) => v.toLocaleString(lang === 'it' ? 'it-IT' : 'en-US', { minimumFractionDigits: d, maximumFractionDigits: d });

function applyStatic() {
  const t = T();
  document.documentElement.lang = lang;
  document.title = t.title;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t[el.dataset.i18n]; });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t[el.dataset.i18nAria]));
  document.querySelectorAll('.lang-switch button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
}

// ---- ring ----
function animateRing() {
  const arc = document.getElementById('ringArc'), n = document.getElementById('ringNum');
  const C = 2 * Math.PI * 42, target = 28 / 43, t0 = performance.now(), dur = 1200;
  (function step(t) {
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    arc.setAttribute('stroke-dasharray', `${C * target * e} ${C}`);
    n.textContent = Math.round(28 * e);
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}

// ---- severity band ----
function buildBand() {
  const t = T();
  const bands = [
    { from: 0, to: 11, r: "0–11", c: "--band-1" }, { from: 12, to: 17, r: "12–17", c: "--band-2" },
    { from: 18, to: 25, r: "18–25", c: "--band-3" }, { from: 26, to: 43, r: "26+", c: "--band-4" }
  ];
  const band = document.getElementById('band'), track = document.getElementById('bandTrack'), labels = document.getElementById('bandLabels');
  track.innerHTML = ''; labels.innerHTML = ''; band.querySelectorAll('.marker').forEach(m => m.remove());
  bands.forEach((b, i) => {
    const w = (b.to - b.from + 1) / 44 * 100;
    const d = document.createElement('div'); d.style.flex = `0 0 calc(${w}% - 2px)`; d.style.background = `var(${b.c})`;
    d.title = `${t.bands[i]}: ${b.r} ${t.symptoms}`; track.appendChild(d);
    const l = document.createElement('div'); l.style.flex = `0 0 calc(${w}% - 2px)`; l.innerHTML = `<b>${t.bands[i]}</b>${b.r}`; labels.appendChild(l);
  });
  const m = document.createElement('div'); m.className = 'marker'; m.style.left = `${28.5 / 44 * 100}%`; m.textContent = t.marker; band.appendChild(m);
}

// ---- criteria ----
let critBuilt = false;
function buildCriteria() {
  const t = T(), root = document.getElementById('crit');
  root.innerHTML = '';
  criteria.forEach((c, i) => {
    const met = c.thr == null ? null : c.v >= c.thr;
    const row = document.createElement('div'); row.className = 'crit-row';
    row.innerHTML = `
      <div class="top"><span>${t.crit[i][0]}</span><b>${c.v} / ${c.max}</b></div>
      <div class="crit-track"><div class="crit-fill" data-w="${c.v / c.max * 100}" style="${critBuilt ? `width:${c.v / c.max * 100}%;transition:none` : ''}"></div>
        ${c.thr != null ? `<div class="crit-thr" style="left:${c.thr / c.max * 100}%"><span>${t.threshold} ${c.thr}</span></div>` : ''}
      </div>
      <div class="meta">${t.crit[i][1]}${met != null ? ` · <span class="ok">${met ? t.met : t.notMet}</span>` : ''}</div>`;
    root.appendChild(row);
  });
  if (!critBuilt) requestAnimationFrame(() => setTimeout(() => root.querySelectorAll('.crit-fill').forEach(f => f.style.width = f.dataset.w + '%'), 120));
  critBuilt = true;
}

// ---- tiles ----
let filter = 'all';
function buildTiles() {
  const t = T(), root = document.getElementById('cats');
  root.innerHTML = '';
  categories.forEach(cat => {
    const row = document.createElement('div'); row.className = 'cat-row';
    const tile = (s, k) => `<span class="tile ${k}${filter !== 'all' && filter !== k ? ' dim' : ''}" data-k="${k}" title="${s.de} · ${k === 'f' ? t.tileFound : t.tileNot}">${s[lang]}</span>`;
    const tiles = cat.found.map(s => tile(s, 'f')).concat(cat.not.map(s => tile(s, 'n'))).join('');
    row.innerHTML = `<div class="cat-name">${cat[lang]}<small>${cat.de} · ${cat.found.length}/${cat.found.length + cat.not.length}</small></div><div class="tiles">${tiles}</div>`;
    root.appendChild(row);
  });
}
document.getElementById('filters').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll('#filters button').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('.tile').forEach(x => x.classList.toggle('dim', filter !== 'all' && x.dataset.k !== filter));
});

// ---- table ----
function buildTable() {
  const t = T(), r = t.rows;
  const rows = [
    r.sf, r.ta, r.ws,
    ...criteria.map((c, i) => [t.crit[i][0], `${c.v} / ${c.max}`, c.thr != null ? `${t.threshold} ${c.thr}` : t.indicative]),
    r.inc,
    ...categories.map(c => [`${r.area}: ${c[lang]}`, `${c.found.length} / ${c.found.length + c.not.length}`, "—"])
  ];
  document.querySelector('#dataTable tbody').innerHTML = rows.map(x => `<tr><td>${x[0]}</td><td class="num">${x[1]}</td><td class="num">${x[2]}</td></tr>`).join('');
}

// ---- charts ----
let charts = [];
function baseOpts(extra = {}) {
  const grid = css('--grid'), text = css('--text-2');
  return Object.assign({
    responsive: true, maintainAspectRatio: false, locale: lang === 'it' ? 'it-IT' : 'en-US',
    animation: { duration: 900, easing: 'easeOutCubic' },
    plugins: {
      legend: { display: false },
      tooltip: { backgroundColor: css('--text'), titleColor: css('--surface'), bodyColor: css('--surface'), padding: 10, cornerRadius: 8, displayColors: false }
    },
    scales: {
      x: { grid: { display: false }, border: { color: grid }, ticks: { color: text, font: { family: 'Inter', size: 12 } } },
      y: { grid: { color: grid }, border: { display: false }, ticks: { color: text, font: { family: 'Inter', size: 12 } } }
    }
  }, extra);
}
const valueLabels = {
  id: 'valueLabels',
  afterDatasetsDraw(chart, _a, opts) {
    if (!opts || !opts.enabled) return;
    const { ctx } = chart; ctx.save();
    ctx.font = '600 12px Inter, sans-serif'; ctx.fillStyle = css('--text');
    chart.data.datasets.forEach((ds, i) => {
      chart.getDatasetMeta(i).data.forEach((bar, j) => {
        const v = ds.data[j]; if (!v) return;
        const txt = opts.fmt ? opts.fmt(v) : v;
        if (chart.options.indexAxis === 'y') { ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(txt, bar.x + 6, bar.y); }
        else { ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText(txt, bar.x, bar.y - 6); }
      });
    });
    ctx.restore();
  }
};

function buildCharts(animate = true) {
  charts.forEach(c => c.destroy()); charts = [];
  const t = T();
  const found = css('--found'), ref = css('--ref'), nf = css('--notfound'), accent = css('--accent'), surface = css('--surface');
  const barStyle = { borderRadius: 4, borderSkipped: 'start', maxBarThickness: 64 };
  const B = baseOpts(); const tip = B.plugins.tooltip;
  const anim = animate ? B.animation : false;
  const groups = [t.grpNo, t.grpYou, t.grpYes];

  charts.push(new Chart(document.getElementById('pctChart'), {
    type: 'bar', plugins: [valueLabels],
    data: { labels: groups, datasets: [{ data: [26, 65.1, 70], backgroundColor: [ref, found, ref], ...barStyle }] },
    options: baseOpts({ animation: anim,
      plugins: { ...B.plugins, valueLabels: { enabled: true, fmt: v => num(v, v % 1 ? 1 : 0) + ' %' },
        tooltip: { ...tip, callbacks: { label: c => `${num(c.parsed.y, c.parsed.y % 1 ? 1 : 0)} % ${t.ofSymptoms}` } } },
      scales: { ...B.scales, y: { ...B.scales.y, min: 0, max: 100, ticks: { ...B.scales.y.ticks, callback: v => v + ' %' } } },
      layout: { padding: { top: 20 } } })
  }));

  charts.push(new Chart(document.getElementById('scoreChart'), {
    type: 'bar', plugins: [valueLabels],
    data: { labels: groups, datasets: [{ data: [3.66, 8.76, 10.18], backgroundColor: [ref, found, ref], ...barStyle }] },
    options: baseOpts({ animation: anim,
      plugins: { ...B.plugins, valueLabels: { enabled: true, fmt: v => num(v, 2) },
        tooltip: { ...tip, callbacks: { label: c => `${t.score} ${num(c.parsed.y, 2)}` } } },
      scales: { ...B.scales, y: { ...B.scales.y, min: 0, max: 12 } },
      layout: { padding: { top: 20 } } })
  }));

  charts.push(new Chart(document.getElementById('catChart'), {
    type: 'bar',
    data: { labels: categories.map(c => c[lang]), datasets: [
      { label: t.found, data: categories.map(c => c.found.length), backgroundColor: found, borderColor: surface, borderWidth: { right: 2 }, borderRadius: 4, borderSkipped: false, barThickness: 20 },
      { label: t.notFound, data: categories.map(c => c.not.length), backgroundColor: nf, borderColor: surface, borderWidth: { left: 2 }, borderRadius: 4, borderSkipped: false, barThickness: 20 }
    ] },
    options: baseOpts({ animation: anim, indexAxis: 'y',
      plugins: { ...B.plugins, tooltip: { ...tip, displayColors: true,
        callbacks: { title: i => categories[i[0].dataIndex][lang],
          label: c => { const cat = categories[c.dataIndex]; const list = c.datasetIndex === 0 ? cat.found : cat.not; return `${c.dataset.label}: ${c.parsed.x}` + (list.length ? ' (' + list.map(s => s[lang]).join(', ') + ')' : ''); } } } },
      scales: {
        x: { stacked: true, grid: { color: css('--grid') }, border: { display: false }, ticks: { color: css('--text-2'), stepSize: 1 }, max: 9 },
        y: { stacked: true, grid: { display: false }, border: { color: css('--grid') }, ticks: { color: css('--text'), font: { family: 'Inter', size: 12.5 } } }
      } })
  }));

  charts.push(new Chart(document.getElementById('incChart'), {
    type: 'bar', plugins: [valueLabels],
    data: { labels: [t.incAvg, t.grpYou], datasets: [{ data: [8.5, 20], backgroundColor: [ref, accent], borderRadius: 4, borderSkipped: 'start', barThickness: 26 }] },
    options: baseOpts({ animation: anim, indexAxis: 'y',
      plugins: { ...B.plugins, valueLabels: { enabled: true, fmt: v => num(v, v % 1 ? 1 : 0) }, tooltip: { ...tip, callbacks: { label: c => `${t.inc} ${num(c.parsed.x, c.parsed.x % 1 ? 1 : 0)}` } } },
      scales: { x: { min: 0, max: 25, grid: { color: css('--grid') }, border: { display: false }, ticks: { color: css('--text-2') } },
                y: { grid: { display: false }, border: { color: css('--grid') }, ticks: { color: css('--text') } } } })
  }));

  // caffeine: coffee ~80 mg/cup, cola ~10 mg/100 ml, chocolate ~0.5 mg/g (estimates)
  const cafV = [320, 50, 10], cafColors = [found, css('--band-2'), css('--band-1')];
  charts.push(new Chart(document.getElementById('cafChart'), {
    type: 'bar',
    data: { labels: [t.cafLabel], datasets: cafV.map((v, i) => ({ label: t.caf[i], data: [v], backgroundColor: cafColors[i], borderColor: surface, borderWidth: { right: 2 }, borderSkipped: false, borderRadius: i === cafV.length - 1 ? 4 : 0, barThickness: 30 })) },
    options: baseOpts({ animation: anim, indexAxis: 'y',
      plugins: { ...B.plugins,
        legend: { display: true, position: 'bottom', labels: { color: css('--text-2'), boxWidth: 12, boxHeight: 12, font: { family: 'Inter', size: 12 } } },
        tooltip: { ...tip, displayColors: true, callbacks: { title: () => t.cafTotal, label: c => `${c.dataset.label}: ≈ ${c.parsed.x} mg` } } },
      scales: { x: { stacked: true, min: 0, max: 450, grid: { color: css('--grid') }, border: { display: false }, ticks: { color: css('--text-2'), maxTicksLimit: 6, maxRotation: 0, callback: v => v + ' mg' } },
                y: { stacked: true, display: false } } }),
    plugins: [{ id: 'limit', afterDatasetsDraw(ch) {
      const x = ch.scales.x.getPixelForValue(400), { top, bottom } = ch.chartArea, ctx = ch.ctx;
      ctx.save(); ctx.strokeStyle = css('--text'); ctx.lineWidth = 2; ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke();
      ctx.setLineDash([]); ctx.fillStyle = css('--text-2'); ctx.font = '11px Inter, sans-serif'; ctx.textAlign = 'right';
      ctx.fillText('400 mg', x - 4, top + 10); ctx.restore();
    } }]
  }));
}

function render(animate) {
  applyStatic(); buildBand(); buildCriteria(); buildTiles(); buildTable();
  if (window.Chart) buildCharts(animate);
}

// ---- language switch ----
document.querySelector('.lang-switch').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch (err) {}
  try { const u = new URL(location.href); u.searchParams.set('lang', lang); history.replaceState(null, '', u); } catch (err) {}
  render(false);
});

// ---- theme ----
document.getElementById('themeBtn').addEventListener('click', () => {
  const root = document.documentElement;
  const isDark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = isDark ? 'light' : 'dark';
  try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
  if (window.Chart) buildCharts(false);
});
try { const th = localStorage.getItem('theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!document.documentElement.dataset.theme && window.Chart) buildCharts(false); });

if (window.Chart) Chart.defaults.font.family = 'Inter, system-ui, sans-serif';
render(true);
animateRing();
</script>
